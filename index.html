<html lang="en">
<head>

<title>class&lt;InterviewPrep&gt;</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

:root{
  --ink:#0B0E13;
  --panel:#12161E;
  --panel-2:#171C26;
  --paper:#E7E9EE;
  --mute:#8A93A3;
  --faint:#525A69;
  --line:#232936;
  --amber:#E7A33E;
  --amber-dim:#5A4726;
  --teal:#4FB6A8;
  --teal-dim:#1F4A44;
  --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--ink);
  color:var(--paper);
  font-family:var(--font-sans);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

::selection{background:var(--amber-dim); color:var(--paper);}
a{color:var(--amber);}

header{ max-width:920px; margin:0 auto; padding:36px 24px 18px; display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
h1{ font-family:var(--font-mono); font-weight:600; font-size:20px; margin:0; letter-spacing:-0.01em; }
.progress-text{ font-family:var(--font-mono); font-size:13px; color:var(--mute); }
.progress-text b{ color:var(--teal); font-weight:600; }

main{ max-width:920px; margin:0 auto; padding:18px 24px 80px; }
.part-divider{ font-family:var(--font-mono); font-size:12px; letter-spacing:.03em; text-transform:uppercase; color:var(--faint); margin:28px 0 10px; }
.part-divider:first-child{ margin-top:0; }

.card{ background:var(--panel); border:1px solid var(--line); border-radius:8px; margin-bottom:10px; overflow:hidden; transition:border-color .2s, opacity .2s; }
.card.done{ border-color:var(--teal-dim); }
.card.done .card-head{ background:linear-gradient(180deg, rgba(79,182,168,.06), transparent); }
.card-head{ display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; list-style:none; }
.card-head::-webkit-details-marker{ display:none; }
.chk{ flex:0 0 auto; width:20px; height:20px; border-radius:5px; border:1.5px solid var(--faint); display:flex; align-items:center; justify-content:center; font-size:12px; color:transparent; transition:all .15s; }
.card.done .chk{ background:var(--teal); border-color:var(--teal); color:var(--ink); }
.chk:hover{ border-color:var(--teal); }
.num{ font-family:var(--font-mono); font-size:12px; color:var(--faint); flex:0 0 auto; width:26px; }
.card-title{ flex:1 1 auto; min-width:0; }
.card-title .t{ font-size:15px; font-weight:600; color:var(--paper); }
.card.done .card-title .t{ color:var(--mute); text-decoration:line-through; text-decoration-color:var(--teal-dim); }
.chips{ display:flex; gap:6px; flex:0 0 auto; }
.chip{ font-family:var(--font-mono); font-size:11px; padding:3px 8px; border-radius:4px; border:1px solid var(--line); color:var(--mute); white-space:nowrap; }
.chip.std{ color:var(--amber); border-color:var(--amber-dim); }
.arrow{ color:var(--faint); font-size:12px; transition:transform .2s; flex:0 0 auto; }
.card[open] .arrow{ transform:rotate(90deg); }

.card-body{ padding:2px 16px 20px 58px; color:var(--mute); font-size:14.5px; }
.card-body h4{ font-family:var(--font-mono); font-size:11.5px; letter-spacing:.03em; text-transform:uppercase; color:var(--faint); margin:16px 0 6px; font-weight:600;}
.card-body h4:first-of-type{ margin-top:6px; }
.primer{ font-size:14.5px; color:var(--paper); background:var(--panel-2); border:1px solid var(--line); border-left:2px solid var(--teal-dim); border-radius:0 6px 6px 0; padding:10px 12px; margin:6px 0 14px; }
.card-body pre{ font-family:var(--font-mono); font-size:13px; background:var(--panel-2); border:1px solid var(--line); border-radius:6px; padding:12px 14px; overflow-x:auto; color:#C9D6E3; margin:0 0 6px; white-space:pre-wrap; word-break:break-word; }
.card-body pre.expected{ color:var(--teal); border-color:var(--teal-dim); }
.card-body ul{ margin:0 0 14px; padding-left:18px; }
.card-body li{ margin-bottom:6px; }
.card-body li::marker{ color:var(--faint); }

.validates{ display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 4px; }
.vtag{ font-family:var(--font-mono); font-size:11px; color:var(--teal); background:var(--teal-dim); border-radius:4px; padding:3px 7px; }

.note{ font-size:13px; color:var(--faint); margin:14px 0 0; padding:8px 10px; border-left:2px solid var(--amber-dim); background:rgba(231,163,62,.05); }

.hints-toggle{ font-family:var(--font-mono); font-size:12px; background:transparent; color:var(--amber); border:1px solid var(--amber-dim); border-radius:4px; padding:5px 10px; cursor:pointer; margin:2px 0 12px; display:inline-block; transition:all .15s; }
.hints-toggle:hover{ background:var(--amber-dim); color:var(--paper); }
.hints-toggle:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
.hint-list{ margin:0 0 14px; padding-left:18px; }
.hint-list li{ display:none; }
.hint-list li.revealed{ display:list-item; animation:fadeInHint .25s ease forwards; }
@keyframes fadeInHint{ from{ opacity:0; transform:translateY(2px); } to{ opacity:1; transform:none; } }

.driver-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:16px 0 6px; }
.driver-head h4{ margin:0; }
.copy-btn{ font-family:var(--font-mono); font-size:11px; background:var(--panel-2); color:var(--mute); border:1px solid var(--line); border-radius:4px; padding:4px 9px; cursor:pointer; white-space:nowrap; transition:all .15s; }
.copy-btn:hover{ color:var(--paper); border-color:var(--faint); }
.copy-btn.copied{ color:var(--teal); border-color:var(--teal-dim); }
.copy-btn:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }

.chk:focus-visible, .card summary:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }

.section-intro{ font-size:13.5px; color:var(--faint); margin:6px 0 16px; max-width:70ch; }
.reveal-toggle{ font-family:var(--font-mono); font-size:12px; background:transparent; color:var(--teal); border:1px solid var(--teal-dim); border-radius:4px; padding:5px 10px; cursor:pointer; margin:8px 0 0; display:inline-block; transition:all .15s; }
.reveal-toggle:hover{ background:var(--teal-dim); color:var(--paper); }
.reveal-toggle:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
.answer-box{ display:none; font-size:14.5px; color:var(--paper); background:var(--panel-2); border:1px solid var(--teal-dim); border-left:2px solid var(--teal); border-radius:0 6px 6px 0; padding:10px 12px; margin:10px 0 0; }
.answer-box.shown{ display:block; }
.concept-card .card-body{ padding-left:58px; }

.solution-toggle{ margin-top:14px; }
.card-body pre.solution-box{ display:none; border-color:var(--teal-dim); border-left:2px solid var(--teal); margin-top:10px; }
.card-body pre.solution-box.shown{ display:block; }

@media (max-width:600px){
  .card-body{ padding-left:16px; }
}

<script>
const PARTS = {
  foundations:  { label: "Object Lifecycle Foundations" },
  semantics:    { label: "Ownership & Semantics" },
  polymorphism: { label: "Polymorphism & Dispatch" },
  idioms:       { label: "Advanced Idioms" },
  quantperf:    { label: "Object Layout & Performance" },
};

const EXERCISES = [
{id:1, part:"foundations", std:"pre-11",
 title:"Member initialization order vs. mem-init-list order",
 primer:"Class members are initialized in the order they're declared in the class body — not the order listed in the constructor's mem-initializer-list — which can silently produce wrong values if a formula depends on that order.",
 includes:["iostream"],
 hints:["Members are always initialized in declaration order, top to bottom in the class body — the order you write them in the mem-init-list is completely ignored by the compiler for ordering purposes.","Compile with -Wreorder (part of -Wall) and the compiler will warn you if your mem-init-list order doesn't match declaration order — a strong signal something's off even before you reason about it.","If a later-declared member's initializer reads an earlier-declared member, that's safe. If an earlier-declared member's initializer reads a later-declared one, that member is still uninitialized garbage at that point."],
 bullets:[
  "Write an Account class with four members declared in this order: id, balance, rate, interest — where interest should be computed as balance * rate at construction time.",
  "Write the constructor's mem-init-list in a different order than the members are declared, and confirm with -Wreorder that the compiler flags it — then explain in a comment why the *actual* initialization order was still correct despite the list being 'out of order'.",
  "Now deliberately break it: declare interest *before* balance and rate in the class body, keep the same formula, and observe that it silently computes garbage instead of failing to compile. Fix it by reordering the declarations back."
 ],
 validates:["declaration-order initialization","mem-init-list is not execution order","-Wreorder"],
 driver:`int main(){\n  Account a(7, 1000.0, 0.05);\n  std::cout << a.getId() << " " << a.getBalance() << " " << a.getInterest() << "\\n";\n}`,
 expected:"7 1000 50",
 solution:`class Account {\npublic:\n    // Mem-init-list order below does NOT match declaration order\n    // (id, balance, rate, interest) -- -Wreorder will flag this -- but\n    // actual initialization still happens id, then balance, then rate,\n    // then interest, because that's fixed by declaration order.\n    Account(int id, double balance, double rate)\n        : rate(rate), balance(balance), id(id), interest(balance * rate) {}\n\n    int getId() const { return id; }\n    double getBalance() const { return balance; }\n    double getInterest() const { return interest; }\n\nprivate:\n    int id;\n    double balance;\n    double rate;\n    double interest;\n};\n\n// Broken variant (for comparison): declaring interest before balance/rate\n// in the class body would initialize interest first, while balance and\n// rate are still uninitialized garbage -- interest silently computes a\n// nonsense value instead of failing to compile.`},

{id:2, part:"foundations", std:"pre-11",
 title:"Rule of Three: deep copies for a resource-owning class",
 primer:"Any class that manages a resource (like a heap allocation) through a raw pointer needs its own copy constructor and copy-assignment operator, because the compiler-generated defaults only copy the pointer's value, not what it points to.",
 includes:["iostream"],
 hints:["A raw owning pointer member means the compiler-generated copy constructor and copy-assignment (which just copy the pointer value) will produce two objects pointing at the same heap block — leading to a double-free when both destructors run.","Copy-assignment needs a self-assignment check (if (this == &other) return *this;) before you delete anything, or self-assignment destroys the data before copying it back.","Build the replacement buffer fully before touching the old one in operator=, so that if new[] throws, the object is left unchanged (the copy-and-swap idiom takes this further, but a simple 'allocate-then-delete' ordering already gets you basic exception safety)."],
 bullets:[
  "Write a Buffer class that owns a dynamically-allocated int[] array plus its size, with a constructor taking the size.",
  "Implement a copy constructor and copy-assignment operator that each perform a true deep copy — not a pointer copy.",
  "Add set(i, v) / get(i) accessors and a destructor that frees the array.",
  "Verify with AddressSanitizer (-fsanitize=address) that there are no leaks or double-frees across copy-construction, copy-assignment, and self-assignment."
 ],
 validates:["Rule of Three","deep vs shallow copy","self-assignment safety"],
 driver:`int main(){\n  Buffer a(3);\n  a.set(0,1); a.set(1,2); a.set(2,3);\n  Buffer b(a);\n  b.set(0,99);\n  std::cout << a.get(0) << " " << b.get(0) << "\\n";\n  Buffer c(1);\n  c = a;\n  c.set(1,42);\n  std::cout << c.get(0) << " " << c.get(1) << " " << a.get(1) << "\\n";\n  c = c;\n  std::cout << c.get(1) << "\\n";\n}`,
 expected:"1 99\n1 42 2\n42",
 solution:`class Buffer {\npublic:\n    explicit Buffer(size_t size) : size_(size), data_(new int[size_]{}) {}\n\n    Buffer(const Buffer& other) : size_(other.size_), data_(new int[size_]) {\n        for (size_t i = 0; i < size_; ++i) data_[i] = other.data_[i];\n    }\n\n    Buffer& operator=(const Buffer& other) {\n        if (this == &other) return *this;\n        int* newData = new int[other.size_];\n        for (size_t i = 0; i < other.size_; ++i) newData[i] = other.data_[i];\n        delete[] data_;\n        data_ = newData;\n        size_ = other.size_;\n        return *this;\n    }\n\n    ~Buffer() { delete[] data_; }\n\n    void set(size_t i, int v) { data_[i] = v; }\n    int get(size_t i) const { return data_[i]; }\n\nprivate:\n    size_t size_;\n    int* data_;\n};`},

{id:3, part:"foundations", std:"C++11",
 title:"Rule of Five: adding move construction and move assignment",
 primer:"C++11 added move construction and move assignment alongside the classic copy operations, letting a resource be transferred out of a temporary or an expiring object instead of always being deep-copied.",
 includes:["iostream"],
 hints:["A move constructor should steal the source's pointer and null it out — the moved-from object must be left in a valid, destructible state (typically 'empty').","Mark move operations noexcept whenever you can actually guarantee they won't throw — containers like std::vector check this trait to decide whether to move or copy elements during reallocation.","Once you steal in the move constructor's init-list (data(o.data)), the very next thing you do in the body is null out o's pointer — otherwise both objects' destructors will try to free the same memory."],
 bullets:[
  "Extend a Buffer-like Matrix class (int* data, size_t n) to full Rule of Five: copy ctor, copy assignment, move ctor, move assignment, and destructor.",
  "The move constructor and move assignment should leave the moved-from object with a null data pointer and size zero.",
  "Add an empty() query, and confirm that using an object after it's been moved-from is safe (it's just empty), even though its *value* is unspecified.",
  "Explain why, if this class only declared a destructor (as in the previous exercise), the compiler would not implicitly generate move operations at all — falling back to copies instead."
 ],
 validates:["Rule of Five","move constructor","move assignment","moved-from state"],
 driver:`int main(){\n  Matrix a(3);\n  a.set(0,10); a.set(1,20); a.set(2,30);\n  Matrix b(std::move(a));\n  std::cout << b.get(0) << " " << b.get(1) << " " << b.get(2) << "\\n";\n  std::cout << std::boolalpha << a.empty() << " " << a.size() << "\\n";\n  Matrix c(1);\n  c = std::move(b);\n  std::cout << c.get(2) << " " << std::boolalpha << b.empty() << "\\n";\n}`,
 expected:"10 20 30\ntrue 0\n30 true",
 solution:`class Matrix {\npublic:\n    explicit Matrix(size_t n) : n_(n), data_(new int[n_]{}) {}\n\n    Matrix(const Matrix& other) : n_(other.n_), data_(new int[n_]) {\n        for (size_t i = 0; i < n_; ++i) data_[i] = other.data_[i];\n    }\n    Matrix& operator=(const Matrix& other) {\n        if (this == &other) return *this;\n        int* newData = new int[other.n_];\n        for (size_t i = 0; i < other.n_; ++i) newData[i] = other.data_[i];\n        delete[] data_;\n        data_ = newData;\n        n_ = other.n_;\n        return *this;\n    }\n\n    Matrix(Matrix&& other) noexcept : n_(other.n_), data_(other.data_) {\n        other.data_ = nullptr;\n        other.n_ = 0;\n    }\n    Matrix& operator=(Matrix&& other) noexcept {\n        if (this == &other) return *this;\n        delete[] data_;\n        data_ = other.data_;\n        n_ = other.n_;\n        other.data_ = nullptr;\n        other.n_ = 0;\n        return *this;\n    }\n\n    ~Matrix() { delete[] data_; }\n\n    void set(size_t i, int v) { data_[i] = v; }\n    int get(size_t i) const { return data_[i]; }\n    bool empty() const { return n_ == 0; }\n    size_t size() const { return n_; }\n\nprivate:\n    size_t n_;\n    int* data_;\n};\n\n// If Matrix only declared a destructor (Rule of Three), the compiler would\n// NOT implicitly generate move operations at all -- declaring a destructor\n// suppresses them -- so the class would silently fall back to copies\n// wherever a move was requested.`},

{id:4, part:"foundations", std:"pre-11",
 title:"const correctness, mutable, and const/non-const overload pairs",
 primer:"const member functions promise not to change an object's observable state; mutable lets a specific member (like an internal cache) be changed anyway, and a member function can be overloaded purely on the constness of the object it's called through.",
 includes:["iostream","vector","numeric"],
 hints:["mutable lets a member be modified even from inside a const member function — the textbook use case is a cache that doesn't change the object's logical (observable) state.","You can overload a member function purely on constness: operator[] can have a const version returning by value and a non-const version returning a reference, and the compiler picks based on the constness of the object it's called on.","Any code path that lets you mutate through operator[] must invalidate the cache — otherwise a caller can silently get a stale cached sum after mutating an element."],
 bullets:[
  "Write a Series class wrapping a std::vector<double>, with a sum() const method that lazily computes and caches the total using a mutable cache flag and cached value.",
  "Add operator[] as a pair of overloads: a non-const version returning double& (which also invalidates the cache, since the caller might mutate through it), and a const version returning double by value.",
  "Confirm that calling sum() twice in a row only does the O(n) computation once, and that mutating through the non-const operator[] correctly forces recomputation on the next sum() call.",
  "Write a free function taking const Series&, and confirm it can only reach the const operator[] overload."
 ],
 validates:["const member functions","mutable","const/non-const overload resolution"],
 driver:`void printFirst(const Series& s) {\n  std::cout << s[0] << "\\n";\n}\nint main(){\n  Series s{1.0, 2.0, 3.0};\n  std::cout << s.sum() << "\\n";\n  std::cout << s.sum() << "\\n";\n  s[0] = 100.0;\n  std::cout << s.sum() << "\\n";\n  printFirst(s);\n}`,
 expected:"6\n6\n105\n100",
 solution:`class Series {\npublic:\n    Series(std::initializer_list<double> vals) : data_(vals) {}\n\n    double sum() const {\n        if (!cacheValid_) {\n            cachedSum_ = std::accumulate(data_.begin(), data_.end(), 0.0);\n            cacheValid_ = true;\n        }\n        return cachedSum_;\n    }\n\n    // Non-const: caller might mutate through the returned reference, so\n    // invalidate the cache.\n    double& operator[](size_t i) {\n        cacheValid_ = false;\n        return data_[i];\n    }\n    // Const: read-only, cache stays valid.\n    double operator[](size_t i) const {\n        return data_[i];\n    }\n\nprivate:\n    std::vector<double> data_;\n    mutable bool cacheValid_ = false;\n    mutable double cachedSum_ = 0.0;\n};`},

{id:5, part:"semantics", std:"C++11",
 title:"Delegating constructors + explicit to control conversions",
 primer:"A constructor can delegate to another constructor of the same class from its initializer list instead of duplicating logic, and marking a converting constructor explicit blocks it from being invoked through an implicit conversion.",
 includes:["iostream"],
 hints:["A delegating constructor calls a sibling constructor in its own mem-init-list — Price(double d) : Price(convertedTicks) {} — and cannot initialize any other members alongside that delegation.","Marking the double-taking constructor explicit stops a bare double from silently converting into a Price wherever a Price is expected — the caller has to write Price(x) or static_cast<Price>(x).","Storing the fundamental unit as integer ticks rather than a floating-point dollar amount avoids floating-point rounding drift accumulating across many arithmetic operations — a real concern once you start summing many prices."],
 bullets:[
  "Write a Price class storing an integer number of ticks internally (1 tick = $0.0001), with a private constructor taking ticks directly.",
  "Add a public default constructor delegating to the ticks constructor with zero, and a public explicit constructor taking a double dollar amount that delegates to the ticks constructor after converting.",
  "Add a static factory fromTicks(long long) for callers who already have a tick count, and dollars() / ticks() accessors.",
  "Write a function taking const Price&, and confirm (by trying it and reading the compiler error) that passing a raw double literal directly fails to compile because the converting constructor is explicit — then fix the call site by constructing a Price explicitly."
 ],
 validates:["delegating constructors","explicit","implicit conversion suppression"],
 driver:`void quote(const Price& p) { std::cout << p.dollars() << "\\n"; }\nint main(){\n  Price p1;\n  Price p2(3.5);\n  Price p3 = Price::fromTicks(125000);\n  std::cout << p1.ticks() << " " << p2.ticks() << " " << p3.ticks() << "\\n";\n  quote(p2);\n  quote(Price(2.25));\n}`,
 expected:"0 35000 125000\n3.5\n2.25",
 solution:`class Price {\npublic:\n    Price() : Price(0LL) {}\n\n    // explicit: blocks a bare double from implicitly converting to Price.\n    explicit Price(double dollars) : Price(static_cast<long long>(dollars * 10000 + (dollars >= 0 ? 0.5 : -0.5))) {}\n\n    static Price fromTicks(long long ticks) { return Price(ticks); }\n\n    double dollars() const { return ticks_ / 10000.0; }\n    long long ticks() const { return ticks_; }\n\nprivate:\n    explicit Price(long long ticks) : ticks_(ticks) {}\n    long long ticks_;\n};\n\n// void quote(const Price&) called with a raw double literal, e.g. quote(2.25),\n// fails to compile: "no known conversion" -- because the double-taking\n// constructor is explicit. The call site must be fixed to quote(Price(2.25)).`},

{id:6, part:"semantics", std:"C++11",
 title:"Defaulted / deleted functions: a move-only handle type",
 primer:"= delete removes a specific special member function entirely (e.g. making a type non-copyable), while = default asks the compiler to generate its normal implementation — together they let you precisely shape which operations a type supports.",
 includes:["iostream","vector"],
 hints:["= delete on the copy constructor and copy-assignment operator makes the type non-copyable while leaving move operations available to declare separately — the deletion doesn't cascade to moves.","Because you've declared copy operations (even as deleted), the compiler will not implicitly generate move operations for you — you have to write both move constructor and move assignment yourself.","A move-only type still works fine inside std::vector, as long as you insert via std::move(temp) or in-place construction — the vector will move elements on reallocation rather than copy them."],
 bullets:[
  "Write a ScopedHandle class wrapping a resource id (a plain int standing in for a file descriptor or socket).",
  "Delete the copy constructor and copy-assignment operator explicitly, and implement move constructor and move assignment that transfer ownership and leave the source's id set to -1 (invalid).",
  "The destructor should print a 'closing' message only if the handle is still valid (id >= 0).",
  "Store several ScopedHandles in a std::vector<ScopedHandle>, inserting with std::move, and confirm the resource is only closed once per real resource — never on a moved-from husk."
 ],
 validates:["deleted special members","move-only types","non-copyable, movable"],
 driver:`int main(){\n  ScopedHandle a(5);\n  ScopedHandle b(std::move(a));\n  std::cout << a.get() << " " << b.get() << "\\n";\n  std::vector<ScopedHandle> handles;\n  handles.push_back(ScopedHandle(10));\n  handles.push_back(std::move(b));\n  std::cout << handles[0].get() << " " << handles[1].get() << "\\n";\n}`,
 expected:"-1 5\n10 5\nclosing 10\nclosing 5",
 solution:`class ScopedHandle {\npublic:\n    explicit ScopedHandle(int id) : id_(id) {}\n\n    ScopedHandle(const ScopedHandle&) = delete;\n    ScopedHandle& operator=(const ScopedHandle&) = delete;\n\n    ScopedHandle(ScopedHandle&& other) noexcept : id_(other.id_) {\n        other.id_ = -1;\n    }\n    ScopedHandle& operator=(ScopedHandle&& other) noexcept {\n        if (this != &other) {\n            if (id_ >= 0) std::cout << "closing " << id_ << "\\n";\n            id_ = other.id_;\n            other.id_ = -1;\n        }\n        return *this;\n    }\n\n    ~ScopedHandle() {\n        if (id_ >= 0) std::cout << "closing " << id_ << "\\n";\n    }\n\n    int get() const { return id_; }\n\nprivate:\n    int id_;\n};`},

{id:7, part:"semantics", std:"pre-11",
 title:"RAII + exception safety via stack unwinding",
 primer:"RAII ties a resource's lifetime to an object's scope: acquisition happens in the constructor and release happens in the destructor, which is guaranteed to run even while an exception is unwinding the stack.",
 includes:["iostream","string","stdexcept"],
 hints:["The destructor is the only piece of cleanup code that's guaranteed to run during stack unwinding, even when an exception is thrown partway through a function — that's the entire premise of RAII.","Track whether the operation succeeded with a simple boolean flag set by an explicit commit() call — the destructor checks that flag and rolls back only if commit() was never reached.","Because the object is destroyed as the stack unwinds past its scope, the rollback message prints *before* the exception is actually caught further up the call stack — the ordering is a good way to confirm you understand unwinding."],
 bullets:[
  "Write a Transaction class that prints a 'begin' message in its constructor and a 'commit' message when an explicit commit() method is called.",
  "In its destructor, print a 'rollback' message only if commit() was never called before destruction.",
  "Write a placeOrder(bool shouldFail) function that constructs a Transaction, optionally throws a std::runtime_error partway through, and otherwise calls commit().",
  "Call placeOrder with both a normal path and a throwing path from within try/catch blocks, and confirm the rollback message appears (from stack unwinding) before your catch block's own message."
 ],
 validates:["RAII","stack unwinding","exception safety"],
 driver:`void placeOrder(bool shouldFail) {\n  Transaction t("order-42");\n  if (shouldFail) throw std::runtime_error("risk check failed");\n  t.commit();\n}\nint main(){\n  try {\n    placeOrder(false);\n  } catch (const std::exception& e) {\n    std::cout << "caught: " << e.what() << "\\n";\n  }\n  try {\n    placeOrder(true);\n  } catch (const std::exception& e) {\n    std::cout << "caught: " << e.what() << "\\n";\n  }\n}`,
 expected:"begin order-42\ncommit order-42\nbegin order-42\nrollback order-42\ncaught: risk check failed",
 solution:`class Transaction {\npublic:\n    explicit Transaction(std::string name) : name_(std::move(name)) {\n        std::cout << "begin " << name_ << "\\n";\n    }\n\n    void commit() {\n        committed_ = true;\n        std::cout << "commit " << name_ << "\\n";\n    }\n\n    ~Transaction() {\n        if (!committed_) std::cout << "rollback " << name_ << "\\n";\n    }\n\nprivate:\n    std::string name_;\n    bool committed_ = false;\n};`},

{id:8, part:"semantics", std:"C++11",
 title:"Instrumenting copies vs. moves under vector reallocation",
 primer:"std::vector relocates its existing elements when it grows past capacity, choosing to move rather than copy them only when the element type's move constructor is marked noexcept.",
 includes:["iostream","vector"],
 hints:["Give your type static copy/move counters incremented in the copy constructor and move constructor respectively, then read them after each block — this turns an invisible performance concern into a printable number.","std::vector only moves elements during reallocation instead of copying them if the move constructor is noexcept — an unmarked or throwing move constructor silently falls back to copies for exception-safety reasons.","reserve()-ing enough capacity upfront means each push_back only has to move-construct the single new element — no existing elements need to be relocated, since there's no reallocation."],
 bullets:[
  "Write an Instrumented class with an int value, static copy and move counters, and a copy constructor / noexcept move constructor that each increment their respective counter.",
  "Push three Instrumented temporaries into a std::vector that has reserve(3) called upfront, and record the copy/move counts.",
  "Reset the counters, then push the same three temporaries into a fresh vector with no reserve() call, and record the counts again.",
  "Explain the difference: with no reserve, each capacity-doubling reallocation has to relocate every already-inserted element in addition to constructing the new one, and confirm your counts match 1, then 2, then 3 relocations across the three pushes."
 ],
 validates:["move vs copy","noexcept move + vector reallocation","instrumentation counters"],
 driver:`int main(){\n  {\n    std::vector<Instrumented> v;\n    v.reserve(3);\n    v.push_back(Instrumented(1));\n    v.push_back(Instrumented(2));\n    v.push_back(Instrumented(3));\n    std::cout << "reserved: copies=" << Instrumented::copies << " moves=" << Instrumented::moves << "\\n";\n  }\n  Instrumented::copies = 0; Instrumented::moves = 0;\n  {\n    std::vector<Instrumented> v;\n    v.push_back(Instrumented(1));\n    v.push_back(Instrumented(2));\n    v.push_back(Instrumented(3));\n    std::cout << "unreserved: copies=" << Instrumented::copies << " moves=" << Instrumented::moves << "\\n";\n  }\n}`,
 expected:"reserved: copies=0 moves=3\nunreserved: copies=0 moves=6",
 solution:`class Instrumented {\npublic:\n    explicit Instrumented(int value) : value_(value) {}\n\n    Instrumented(const Instrumented& other) : value_(other.value_) { ++copies; }\n    Instrumented(Instrumented&& other) noexcept : value_(other.value_) { ++moves; }\n\n    Instrumented& operator=(const Instrumented&) = default;\n    Instrumented& operator=(Instrumented&&) noexcept = default;\n\n    int value() const { return value_; }\n\n    static int copies;\n    static int moves;\n\nprivate:\n    int value_;\n};\n\nint Instrumented::copies = 0;\nint Instrumented::moves = 0;`},

{id:9, part:"semantics", std:"C++11",
 title:"Static members: instance counting + a Meyers singleton",
 primer:"A static data member is shared across every instance of a class; a function-local static variable is lazily initialized exactly once, on first use, with that initialization guaranteed thread-safe since C++11 — the basis of the Meyers singleton.",
 includes:["iostream","string","map"],
 hints:["A static data member is shared across every instance of the class — it needs exactly one definition outside the class (or use inline for a C++17-and-later in-class definition).","A Meyers singleton — a static local variable inside a function — is guaranteed by the C++11 standard to be both lazily initialized on first use and thread-safe to initialize, with no manual locking needed.","Deleting the copy constructor and copy-assignment operator on the singleton class prevents anyone from accidentally creating a second instance by copying the one returned by instance()."],
 bullets:[
  "Write a ConfigManager class with a private constructor (that prints a message so you can see when it runs), a deleted copy constructor and copy-assignment, and a static instance() method returning a ConfigManager& via a function-local static.",
  "Add set(key, value) / get(key) methods backed by a std::map<string,string> member.",
  "Call ConfigManager::instance() several times and confirm the constructor message only prints once, no matter how many times instance() is called.",
  "Separately, write a Widget class with a static int liveCount incremented in the constructor and decremented in the destructor, and confirm the count rises and falls correctly as Widgets enter and leave scope."
 ],
 validates:["static data members","Meyers singleton","lazy + thread-safe static init"],
 driver:`int main(){\n  ConfigManager::instance().set("mode", "prod");\n  std::cout << ConfigManager::instance().get("mode") << "\\n";\n  ConfigManager::instance();\n  std::cout << Widget::count() << "\\n";\n  {\n    Widget a, b;\n    std::cout << Widget::count() << "\\n";\n    Widget c;\n    std::cout << Widget::count() << "\\n";\n  }\n  std::cout << Widget::count() << "\\n";\n}`,
 expected:"ConfigManager constructed\nprod\n0\n2\n3\n0",
 solution:`class ConfigManager {\npublic:\n    static ConfigManager& instance() {\n        static ConfigManager inst; // constructed once, on first call\n        return inst;\n    }\n\n    void set(const std::string& key, const std::string& value) { data_[key] = value; }\n    std::string get(const std::string& key) const {\n        auto it = data_.find(key);\n        return it != data_.end() ? it->second : std::string();\n    }\n\n    ConfigManager(const ConfigManager&) = delete;\n    ConfigManager& operator=(const ConfigManager&) = delete;\n\nprivate:\n    ConfigManager() { std::cout << "ConfigManager constructed\\n"; }\n    std::map<std::string, std::string> data_;\n};\n\nclass Widget {\npublic:\n    Widget() { ++count_; }\n    ~Widget() { --count_; }\n    static int count() { return count_; }\n\nprivate:\n    static int count_;\n};\n\nint Widget::count_ = 0;`},

{id:10, part:"polymorphism", std:"pre-11",
 title:"Virtual dispatch vs. object slicing",
 primer:"Virtual functions resolve to the most-derived override when called through a pointer or reference, but copying a derived object by value into a base-typed variable 'slices' off the derived part, leaving a plain base object behind.",
 includes:["iostream","string","memory"],
 hints:["Slicing happens whenever a derived object is copied *by value* into a variable of the base type — the derived-only data and the vtable pointer setup for the derived type are both lost; the object becomes a genuine, plain Instrument.","A reference or pointer to the base type does not slice anything — it's still looking at the original derived object, so virtual calls through it still dispatch to the derived override.","Rule of thumb for spotting risk: any function parameter or variable typed as Base (by value) that receives a Derived argument is a slicing site. Base& or Base* is safe from slicing."],
 bullets:[
  "Write an Instrument base class with a virtual describe() returning a string, and a virtual destructor.",
  "Write a Bond class deriving from Instrument that overrides describe().",
  "Copy a Bond into an Instrument variable by value and call describe() on it — confirm it prints the base class's description (sliced), not Bond's.",
  "Now call describe() through an Instrument& bound to the same Bond object, and separately through a std::unique_ptr<Instrument> pointing at a heap-allocated Bond — confirm both correctly dispatch to Bond's override."
 ],
 validates:["virtual dispatch","object slicing","reference/pointer vs value semantics"],
 driver:`int main(){\n  Bond b;\n  Instrument sliced = b;\n  std::cout << sliced.describe() << "\\n";\n  Instrument& ref = b;\n  std::cout << ref.describe() << "\\n";\n  std::unique_ptr<Instrument> p = std::make_unique<Bond>();\n  std::cout << p->describe() << "\\n";\n}`,
 expected:"Instrument\nBond\nBond",
 solution:`class Instrument {\npublic:\n    virtual std::string describe() const { return "Instrument"; }\n    virtual ~Instrument() = default;\n};\n\nclass Bond : public Instrument {\npublic:\n    std::string describe() const override { return "Bond"; }\n};\n\n// Instrument sliced = b;      -> copies only the Instrument part: "Instrument"\n// Instrument& ref = b;        -> still looking at the real Bond: "Bond"\n// unique_ptr<Instrument> p... -> points at a heap Bond, dispatches: "Bond"`},

{id:11, part:"polymorphism", std:"pre-11",
 title:"Why a polymorphic base needs a virtual destructor",
 primer:"A base class meant to be deleted through a pointer to that base needs a virtual destructor — otherwise only the base class's destructor runs, silently skipping any derived-class cleanup.",
 includes:["iostream"],
 hints:["Deleting a derived object through a pointer to a base class whose destructor is not virtual is undefined behavior — in practice, most compilers simply skip the derived class's destructor entirely, which is exactly the leak/bug this exercise makes visible.","Marking the base destructor virtual is enough — you don't need to (and generally shouldn't) mark every derived destructor virtual too, though override is a nice-to-have on the derived one.","This matters constantly in quant codebases: any class meant to be used polymorphically through a base pointer (an abstract Strategy, a PricingModel interface) needs a virtual destructor the moment it has even one virtual function."],
 bullets:[
  "Write a BadBase / BadDerived pair where neither destructor is virtual, each printing its own name when it runs.",
  "Write a GoodBase / GoodDerived pair identical in structure, but where GoodBase's destructor is declared virtual.",
  "Create each derived object on the heap, store it in a pointer to its *base* type, and delete through that base pointer.",
  "Confirm the bad pair only prints the base class's destructor message (the derived cleanup never runs), while the good pair prints both, in derived-then-base order."
 ],
 validates:["virtual destructors","polymorphic deletion","base-pointer ownership"],
 driver:`int main(){\n  BadBase* bad = new BadDerived();\n  delete bad;\n  std::cout << "---\\n";\n  GoodBase* good = new GoodDerived();\n  delete good;\n}`,
 expected:"~BadBase\n---\n~GoodDerived\n~GoodBase",
 solution:`class BadBase {\npublic:\n    ~BadBase() { std::cout << "~BadBase\\n"; }\n};\nclass BadDerived : public BadBase {\npublic:\n    ~BadDerived() { std::cout << "~BadDerived\\n"; }\n};\n\nclass GoodBase {\npublic:\n    virtual ~GoodBase() { std::cout << "~GoodBase\\n"; }\n};\nclass GoodDerived : public GoodBase {\npublic:\n    ~GoodDerived() override { std::cout << "~GoodDerived\\n"; }\n};\n\n// delete bad (a BadBase*) only runs ~BadBase -- undefined behavior in\n// general, but in practice the derived cleanup is simply skipped.\n// delete good (a GoodBase*) correctly runs ~GoodDerived then ~GoodBase.`},

{id:12, part:"polymorphism", std:"pre-11",
 title:"Multiple inheritance, the diamond problem, and virtual inheritance",
 primer:"When a class inherits from two classes that both derive from a common base, virtual inheritance ensures there's a single shared instance of that base, instead of one ambiguous copy per inheritance path.",
 includes:["iostream","string"],
 hints:["Without virtual inheritance, a class inheriting from two classes that both derive from the same base ends up with two separate copies of that base's data — and any unqualified access to a shared member becomes ambiguous and fails to compile.","Declaring virtual public Animal in both Swimmer and Walker makes them share a single Animal subobject inside any further-derived class like Duck.","With virtual inheritance, the *most-derived* class becomes directly responsible for initializing the shared virtual base — Duck's constructor must call Animal's constructor directly in its mem-init-list, even though Duck doesn't directly inherit from Animal; any Animal initialization written in Swimmer or Walker's own mem-init-list is ignored when they're not the most-derived class."],
 bullets:[
  "Write an Animal base class storing a name and a virtual speak() method.",
  "Write Swimmer and Walker, each virtually inheriting from Animal and adding a swim() / walk() method respectively.",
  "Write Duck inheriting from both Swimmer and Walker, and get its constructor's mem-init-list right so there's exactly one Animal subobject, correctly initialized.",
  "Explain (in a comment) what would go wrong — ambiguous base access, or a compile error — if Swimmer and Walker inherited from Animal non-virtually instead."
 ],
 validates:["diamond inheritance","virtual inheritance","most-derived-class initialization"],
 driver:`int main(){\n  Duck d("Donald");\n  d.swim();\n  d.walk();\n  d.speak();\n  std::cout << d.name << "\\n";\n}`,
 expected:"Donald swims\nDonald walks\nDonald makes a sound\nDonald",
 solution:`class Animal {\npublic:\n    explicit Animal(std::string name) : name(std::move(name)) {}\n    virtual void speak() const { std::cout << name << " makes a sound\\n"; }\n    virtual ~Animal() = default;\n    std::string name;\n};\n\nclass Swimmer : public virtual Animal {\npublic:\n    explicit Swimmer(const std::string& name) : Animal(name) {}\n    void swim() const { std::cout << name << " swims\\n"; }\n};\n\nclass Walker : public virtual Animal {\npublic:\n    explicit Walker(const std::string& name) : Animal(name) {}\n    void walk() const { std::cout << name << " walks\\n"; }\n};\n\nclass Duck : public Swimmer, public Walker {\npublic:\n    // Duck is the most-derived class, so it must initialize the shared\n    // virtual Animal base directly -- any Animal init written inside\n    // Swimmer's or Walker's own mem-init-list is ignored here.\n    explicit Duck(const std::string& name)\n        : Animal(name), Swimmer(name), Walker(name) {}\n};\n\n// Without virtual inheritance, Duck would contain two separate Animal\n// subobjects (one via Swimmer, one via Walker) -- d.name and d.speak()\n// would both become ambiguous and fail to compile.`},

{id:13, part:"polymorphism", std:"pre-11",
 title:"CRTP: compile-time polymorphism without a vtable",
 primer:"The Curiously Recurring Template Pattern has a base class template take its own derived class as a parameter and call back into it via static_cast, giving polymorphic-style dispatch resolved entirely at compile time, with no vtable.",
 includes:["iostream"],
 hints:["The Curiously Recurring Template Pattern has the base template take its own derived class as a template parameter — class FlatPricer : public PricerBase<FlatPricer> — letting the base static_cast(this) to the derived type and call its methods directly, resolved entirely at compile time.","Because there's no virtual function involved, a CRTP base class typically adds zero bytes to the derived object's size — compare sizeof of a CRTP-based class against an otherwise-equivalent class with a virtual function (which needs a hidden vtable pointer, usually 8 bytes on a 64-bit target).","The tradeoff for the performance win is flexibility: you can't hold a heterogeneous collection of 'anything derived from PricerBase' behind one pointer type the way you can with real virtual dispatch — each instantiation is its own distinct type."],
 bullets:[
  "Write a PricerBase<Derived> class template whose price() method calls static_cast<const Derived*>(this)->priceImpl().",
  "Write FlatPricer and SpreadPricer, each deriving from PricerBase<Self> and implementing priceImpl().",
  "Write a totalCost(const PricerBase<P>&, int qty) function template that works for any pricer type via the CRTP base.",
  "Compare sizeof(FlatPricer) against sizeof of an otherwise-identical class using a real virtual function, and explain the difference in terms of vtable pointers."
 ],
 validates:["CRTP","static polymorphism","vtable overhead vs. templates"],
 driver:`int main(){\n  FlatPricer fp;\n  SpreadPricer sp(99.5, 100.5);\n  std::cout << fp.price() << " " << sp.price() << "\\n";\n  std::cout << totalCost(fp, 10) << " " << totalCost(sp, 4) << "\\n";\n  std::cout << sizeof(FlatPricer) << " " << sizeof(VirtualPricer) << "\\n";\n}`,
 expected:"100 100\n1000 400\n1 8",
 solution:`template <typename Derived>\nclass PricerBase {\npublic:\n    double price() const {\n        return static_cast<const Derived*>(this)->priceImpl();\n    }\n};\n\nclass FlatPricer : public PricerBase<FlatPricer> {\npublic:\n    double priceImpl() const { return 100.0; }\n};\n\nclass SpreadPricer : public PricerBase<SpreadPricer> {\npublic:\n    SpreadPricer(double bid, double ask) : bid_(bid), ask_(ask) {}\n    double priceImpl() const { return (bid_ + ask_) / 2.0; }\nprivate:\n    double bid_, ask_;\n};\n\ntemplate <typename P>\ndouble totalCost(const PricerBase<P>& pricer, int qty) {\n    return pricer.price() * qty;\n}\n\n// For comparison: a virtual-dispatch equivalent needs a vptr, so it costs\n// one pointer's worth of size even with no data members of its own.\nclass VirtualPricer {\npublic:\n    virtual double price() const { return 100.0; }\n    virtual ~VirtualPricer() = default;\n};`},

{id:14, part:"polymorphism", std:"pre-11",
 title:"Pure virtual interfaces and polymorphic ownership",
 primer:"A pure virtual function (= 0) makes a class abstract and impossible to instantiate directly — it exists purely to define a contract that concrete derived classes are required to implement.",
 includes:["iostream","vector","memory"],
 hints:["A pure virtual function (= 0) makes the class abstract — the compiler will refuse to let you construct a bare RiskModel, only its concrete derived classes.","Because RiskModel needs a virtual destructor for safe polymorphic deletion, storing derived objects behind std::unique_ptr<RiskModel> gives you both correct cleanup and value semantics you can move around.","This is the standard shape of a 'strategy' interface in quant systems: one abstract contract (var()), several interchangeable concrete implementations, iterated over via a container of base-class pointers."],
 bullets:[
  "Write an abstract RiskModel class with a pure virtual var(double notional) const method and a virtual destructor.",
  "Write ParametricVar and HistoricalVar concrete implementations with different internal parameters and formulas.",
  "Attempt to instantiate a bare RiskModel directly and read the compiler's error about the pure virtual function — then remove that attempt.",
  "Build a std::vector<std::unique_ptr<RiskModel>> holding one of each concrete model, and sum var(1000000.0) across all of them."
 ],
 validates:["pure virtual functions","abstract base classes","polymorphic containers"],
 driver:`int main(){\n  std::vector<std::unique_ptr<RiskModel>> models;\n  models.push_back(std::make_unique<ParametricVar>(0.02));\n  models.push_back(std::make_unique<HistoricalVar>(0.045));\n  double total = 0;\n  for (const auto& m : models) {\n    total += m->var(1000000.0);\n  }\n  std::cout << total << "\\n";\n}`,
 expected:"91600",
 solution:`class RiskModel {\npublic:\n    virtual double var(double notional) const = 0;\n    virtual ~RiskModel() = default;\n};\n\nclass ParametricVar : public RiskModel {\npublic:\n    explicit ParametricVar(double volatility) : volatility_(volatility) {}\n    double var(double notional) const override {\n        constexpr double zScore99 = 2.33; // 99% one-tailed confidence\n        return notional * volatility_ * zScore99;\n    }\nprivate:\n    double volatility_;\n};\n\nclass HistoricalVar : public RiskModel {\npublic:\n    explicit HistoricalVar(double lossQuantile) : lossQuantile_(lossQuantile) {}\n    double var(double notional) const override {\n        return notional * lossQuantile_;\n    }\nprivate:\n    double lossQuantile_;\n};\n\n// RiskModel model; would fail to compile: "cannot declare variable ... to\n// be of abstract type" because var() is pure virtual.`},

{id:15, part:"idioms", std:"C++11",
 title:"PIMPL: hiding implementation behind a unique_ptr",
 primer:"The Pointer-to-Implementation idiom hides a class's private data behind a pointer to a forward-declared, incomplete type, so changing the implementation's internals doesn't force every dependent file to recompile.",
 includes:["iostream","map","memory"],
 hints:["The class only forward-declares its Impl struct in the header (struct Impl; std::unique_ptr<Impl> pImpl;) — the full definition of Impl lives in the source file, where client code never sees it and never needs to recompile against it.","std::unique_ptr<Impl> requires Impl to be a *complete* type wherever it's destroyed — so the destructor (even a defaulted one) must be defined in the source file, after Impl's definition, not implicitly generated in the header.","Because the destructor is user-declared (even as = default in the .cpp), the compiler won't implicitly generate move operations — you need to explicitly default the move constructor and move assignment as well if you want the class to stay movable."],
 bullets:[
  "Design an OrderBook class using the PIMPL idiom: the public class only holds a std::unique_ptr<Impl> to a forward-declared nested struct, with addOrder() and bestBid() as its public interface.",
  "Define the real data (a std::map<double,int> of price to quantity) inside the Impl struct, defined out-of-line together with the class's out-of-line constructor and destructor.",
  "Explicitly default the move constructor and move assignment operator out-of-line (after Impl is a complete type), and delete the copy operations.",
  "Explain what PIMPL buys you in a large codebase: changing Impl's internals doesn't change OrderBook's size or its header, so dependents don't need to recompile."
 ],
 validates:["PIMPL idiom","incomplete types + unique_ptr","binary/compile firewalling"],
 driver:`int main(){\n  OrderBook book;\n  book.addOrder(101.5, 100);\n  book.addOrder(102.25, 50);\n  std::cout << book.bestBid() << "\\n";\n  OrderBook moved(std::move(book));\n  std::cout << moved.bestBid() << "\\n";\n}`,
 expected:"102.25\n102.25",
 solution:`// order_book.h\nclass OrderBook {\npublic:\n    OrderBook();\n    ~OrderBook();\n    OrderBook(OrderBook&&) noexcept;\n    OrderBook& operator=(OrderBook&&) noexcept;\n    OrderBook(const OrderBook&) = delete;\n    OrderBook& operator=(const OrderBook&) = delete;\n\n    void addOrder(double price, int qty);\n    double bestBid() const;\n\nprivate:\n    struct Impl;                    // incomplete here -- clients never see it\n    std::unique_ptr<Impl> pImpl;\n};\n\n// order_book.cpp\nstruct OrderBook::Impl {\n    std::map<double, int> book;     // price -> quantity\n};\n\nOrderBook::OrderBook() : pImpl(std::make_unique<Impl>()) {}\n// Defined here, not in the header: unique_ptr<Impl>'s destructor needs\n// Impl to be a complete type.\nOrderBook::~OrderBook() = default;\nOrderBook::OrderBook(OrderBook&&) noexcept = default;\nOrderBook& OrderBook::operator=(OrderBook&&) noexcept = default;\n\nvoid OrderBook::addOrder(double price, int qty) {\n    pImpl->book[price] = qty;\n}\n\ndouble OrderBook::bestBid() const {\n    return pImpl->book.rbegin()->first; // highest price = best bid\n}\n\n// Changing Impl's internals never changes OrderBook's size or header, so\n// files that only use OrderBook don't need to recompile.`},

{id:16, part:"idioms", std:"C++11",
 title:"Mixins via CRTP + the Empty Base Optimization",
 primer:"A mixin is a small, typically stateless class meant purely to be inherited from for its behavior; the Empty Base Optimization lets such an empty base class add zero bytes to a derived object, unlike an empty class held as a data member.",
 includes:["iostream","string"],
 hints:["A mixin is a small class template meant to be inherited from purely to add behavior — Loggable<T> and Comparable<T> here don't hold any data of their own, they just add methods that operate through a CRTP-style static_cast(this).","A class can inherit from any number of these empty mixins at once via multiple inheritance, composing behavior without duplicating code across unrelated classes.","The Empty Base Optimization lets an empty base class (like these mixins) add zero bytes to a derived object's size, because the base and the first derived member are allowed to share the same address — contrast that with making an empty class a *member* instead of a base, where it must get its own distinct address and typically adds padding."],
 bullets:[
  "Write two empty mixin templates, Loggable<T> (adding a log(msg) method) and Comparable<T> (adding a sameAs(other) method that compares via a key() method T must provide), each using CRTP to call into T.",
  "Write an Order class inheriting from both Loggable<Order> and Comparable<Order>, providing key().",
  "Confirm sizeof(Order) is no larger than it would be with zero mixin bases — i.e. the mixins added no storage.",
  "Separately, define an Empty class and compare sizeof of a class that inherits from Empty (EBO applies) against a class that instead holds an Empty as a data member (EBO does not apply to members) — explain the size difference you observe."
 ],
 validates:["CRTP mixins","Empty Base Optimization","empty-base vs. empty-member sizing"],
 driver:`int main(){\n  Order o1(42), o2(42), o3(7);\n  o1.log("created order");\n  std::cout << std::boolalpha << o1.sameAs(o2) << " " << o1.sameAs(o3) << "\\n";\n  std::cout << sizeof(Empty) << " " << sizeof(WithBaseEBO) << " " << sizeof(WithMember) << "\\n";\n}`,
 expected:"[LOG] created order\ntrue false\n1 4 8",
 solution:`template <typename T>\nclass Loggable {\npublic:\n    void log(const std::string& msg) const {\n        std::cout << "[LOG] " << msg << "\\n";\n    }\n};\n\ntemplate <typename T>\nclass Comparable {\npublic:\n    bool sameAs(const T& other) const {\n        return static_cast<const T*>(this)->key() == other.key();\n    }\n};\n\nclass Order : public Loggable<Order>, public Comparable<Order> {\npublic:\n    explicit Order(int id) : id_(id) {}\n    int key() const { return id_; }\nprivate:\n    int id_;\n};\n\nclass Empty {};\n\n// EBO applies: Empty as a base can share Order's address, adding 0 bytes.\nclass WithBaseEBO : public Empty {\n    int value;\n};\n\n// EBO does not apply to data members: Empty needs its own address here,\n// so it costs a byte (plus padding to align the following int).\nclass WithMember {\n    Empty e;\n    int value;\n};`},

{id:17, part:"idioms", std:"C++20",
 title:"Operator overloading + the spaceship operator",
 primer:"Operator overloading lets a user-defined type support familiar syntax like + and <; C++20's defaulted operator<=> can generate all six relational and equality comparisons from a single declaration.",
 includes:["iostream","vector","algorithm","compare"],
 hints:["operator<=> defaulted (= default) generates all six relational operators (<, <=, >, >=, ==, !=) at once, comparing members in declaration order — for a single-member class like this it's a one-liner.","operator+= should do the real work and return *this by reference; operator+ can then be implemented in terms of it (make a copy, += it, return the copy) to avoid duplicating logic.","Once <=> is defaulted, ordinary algorithms like std::sort just work on a std::vector of your type with no extra comparator needed."],
 bullets:[
  "Write a Money class storing an integer cent count internally, with operator+ and operator+= for combining amounts.",
  "Default operator<=> to get all relational and equality comparisons for free, comparing by cent count.",
  "Add a friend operator<< that prints the amount formatted as dollars.cents.",
  "Confirm you can std::sort a std::vector<Money> with no custom comparator, purely from the defaulted spaceship operator."
 ],
 validates:["operator overloading","defaulted operator<=>","free comparisons + std::sort"],
 driver:`int main(){\n  Money a(1050), b(275);\n  std::cout << (a + b) << "\\n";\n  a += b;\n  std::cout << a << "\\n";\n  std::cout << std::boolalpha << (Money(500) < Money(600)) << " " << (Money(500) == Money(500)) << "\\n";\n  std::vector<Money> ms{Money(300), Money(100), Money(200)};\n  std::sort(ms.begin(), ms.end());\n  for (const auto& m : ms) std::cout << m << " ";\n  std::cout << "\\n";\n}`,
 expected:"13.25\n13.25\ntrue true\n1.00 2.00 3.00 ",
 solution:`class Money {\npublic:\n    explicit Money(int cents) : cents_(cents) {}\n\n    Money& operator+=(const Money& other) {\n        cents_ += other.cents_;\n        return *this;\n    }\n    friend Money operator+(Money lhs, const Money& rhs) {\n        lhs += rhs;\n        return lhs;\n    }\n\n    // Defaulting <=> alone is enough to get <, <=, >, >=, ==, and != for free.\n    auto operator<=>(const Money&) const = default;\n\n    friend std::ostream& operator<<(std::ostream& os, const Money& m) {\n        int whole = m.cents_ / 100;\n        int frac = m.cents_ % 100;\n        if (frac < 0) frac = -frac;\n        os << whole << "." << (frac < 10 ? "0" : "") << frac;\n        return os;\n    }\n\nprivate:\n    int cents_;\n};`},

{id:18, part:"idioms", std:"pre-11",
 title:"Friend classes + a nested iterator class for encapsulation",
 primer:"friend grants one specific class or function access to your private members without making them public; a nested class can serve as a private implementation detail — like a custom iterator — that only its owning class needs to expose.",
 includes:["iostream","vector"],
 hints:["friend class PortfolioAuditor; grants that one specific class full access to Portfolio's private members, without opening access to everyone — a narrower escape hatch than making the members public.","A nested Iterator class can hold a pointer back to its owning Portfolio plus an index, and stays a genuinely private implementation detail if you don't expose its internals — only operator*, operator++, and operator!= need to be public.","Providing begin()/end() returning your nested Iterator type is exactly what makes range-based for loops (for (double v : portfolio)) work, with zero library dependency."],
 bullets:[
  "Write a Portfolio class holding a private std::vector<double> of positions, with an add(v) method.",
  "Declare a separate PortfolioAuditor class as a friend of Portfolio, and give it a static total(const Portfolio&) method that sums positions by reaching directly into Portfolio's private data.",
  "Write a nested Portfolio::Iterator class (holding a pointer to the Portfolio and an index) supporting operator*, operator++, and operator!=, and add begin()/end() methods to Portfolio returning it.",
  "Confirm a range-based for loop over a Portfolio works using your nested iterator, and that PortfolioAuditor can compute the total via friendship without any public getter existing."
 ],
 validates:["friend classes","nested classes","custom iterators for range-based for"],
 driver:`int main(){\n  Portfolio p;\n  p.add(100.0); p.add(250.5); p.add(-30.5);\n  for (double v : p) std::cout << v << " ";\n  std::cout << "\\n";\n  std::cout << PortfolioAuditor::total(p) << "\\n";\n}`,
 expected:"100 250.5 -30.5 \n320",
 solution:`class Portfolio {\npublic:\n    friend class PortfolioAuditor;\n\n    void add(double v) { positions_.push_back(v); }\n\n    class Iterator {\n    public:\n        Iterator(const Portfolio* p, size_t idx) : p_(p), idx_(idx) {}\n        double operator*() const { return p_->positions_[idx_]; }\n        Iterator& operator++() { ++idx_; return *this; }\n        bool operator!=(const Iterator& other) const { return idx_ != other.idx_; }\n    private:\n        const Portfolio* p_;\n        size_t idx_;\n    };\n\n    Iterator begin() const { return Iterator(this, 0); }\n    Iterator end() const { return Iterator(this, positions_.size()); }\n\nprivate:\n    std::vector<double> positions_;\n};\n\nclass PortfolioAuditor {\npublic:\n    static double total(const Portfolio& p) {\n        double sum = 0.0;\n        for (double v : p.positions_) sum += v; // reaches private data via friendship\n        return sum;\n    }\n};`},

{id:19, part:"quantperf", std:"C++11",
 title:"Struct padding, member ordering, and alignas",
 primer:"The compiler inserts padding between struct members so each one lands at an address matching its alignment requirement, meaning the same fields declared in a different order can produce a smaller (or larger) struct.",
 includes:["iostream","cstddef"],
 hints:["The compiler inserts padding bytes between members so that each one sits at an address matching its natural alignment (an 8-byte double needs an 8-byte-aligned address) — offsetof from <cstddef> lets you see exactly where each member landed.","Simply reordering members from largest-alignment to smallest-alignment (double before int before char) is usually enough to eliminate most internal padding, without changing anything about how the struct is used.","alignas(N) forces a type's alignment (and therefore often its size, rounded up) to at least N — useful for aligning hot data to cache-line boundaries (commonly 64 bytes) to avoid false sharing between cores, though the example here uses a smaller alignment to keep the numbers easy to read."],
 bullets:[
  "Define TickBad as a struct with members in the order char flag, double price, int qty, and print sizeof(TickBad) plus each member's offsetof.",
  "Define TickGood with the same three members reordered as double price, int qty, char flag, and compare its sizeof and offsets against TickBad.",
  "Explain in a comment exactly where the padding bytes went in TickBad, in terms of double's 8-byte alignment requirement.",
  "Define a third struct, TickAligned, holding just a double and an int but declared alignas(16), and confirm sizeof and alignof both reflect the forced alignment."
 ],
 validates:["struct padding","member reordering","alignas / alignof","offsetof"],
 driver:`int main(){\n  std::cout << sizeof(TickBad) << "\\n";\n  std::cout << offsetof(TickBad, flag) << " " << offsetof(TickBad, price) << " " << offsetof(TickBad, qty) << "\\n";\n  std::cout << sizeof(TickGood) << "\\n";\n  std::cout << offsetof(TickGood, price) << " " << offsetof(TickGood, qty) << " " << offsetof(TickGood, flag) << "\\n";\n  std::cout << sizeof(TickAligned) << " " << alignof(TickAligned) << "\\n";\n}`,
 expected:"24\n0 8 16\n16\n0 8 12\n16 16",
 solution:`struct TickBad {\n    char flag;    // offset 0, 1 byte\n    double price; // needs 8-byte alignment -> 7 bytes padding, then offset 8\n    int qty;      // offset 16\n};\n// sizeof(TickBad) == 24: 1 (flag) + 7 (padding) + 8 (price) + 4 (qty)\n// + 4 trailing padding, rounded up to a multiple of double's 8-byte align.\n\nstruct TickGood {\n    double price; // offset 0\n    int qty;      // offset 8\n    char flag;    // offset 12\n};\n// sizeof(TickGood) == 16: 8 + 4 + 1 + 3 trailing padding (multiple of 8).\n// Ordering largest-alignment-first to smallest eliminates the internal gaps.\n\nstruct alignas(16) TickAligned {\n    double price;\n    int qty;\n};\n// alignas(16) forces alignof == 16 and rounds sizeof up to a multiple of 16.`},

{id:20, part:"quantperf", std:"pre-11",
 title:"Array-of-Structs vs. Struct-of-Arrays object design",
 primer:"Array-of-Structs stores each record's fields together in memory; Struct-of-Arrays stores each field contiguously across all records instead — a layout decision about cache efficiency that doesn't change what's computed, only how efficiently it's read.",
 includes:["iostream","vector"],
 hints:["Array-of-Structs (a std::vector<TickAoS>) stores each tick's fields contiguously, so touching just the price field of every tick still pulls the unrelated volume field into cache alongside it.","Struct-of-Arrays (separate std::vector<double> prices; std::vector<long> volumes;) stores each field contiguously across all ticks instead — a loop that only touches prices streams through cache lines with no wasted volume data mixed in.","Both layouts should compute identical results for the same logical data — SoA vs. AoS is purely a memory-layout decision, not a change in what's being computed; the real payoff (fewer cache misses over large datasets) shows up in timing, not in the answer's correctness."],
 bullets:[
  "Define TickAoS as a struct of {double price; long volume;}, and a free function vwapAoS computing the volume-weighted average price over a std::vector<TickAoS>.",
  "Define a TickBookSoA class holding parallel std::vector<double> and std::vector<long> members, with an add(price, volume) method and its own vwap() computing the same quantity.",
  "Feed both representations the same tick data and confirm they produce identical VWAP results.",
  "Explain, in terms of cache-line utilization, why a hot loop that only reads price (e.g. computing a moving average) would touch fewer cache lines against the SoA layout than the AoS layout as tick count grows large."
 ],
 validates:["AoS vs SoA","cache-conscious object design","data-oriented layout"],
 driver:`int main(){\n  std::vector<TickAoS> aos{{101.5, 100}, {101.75, 200}, {101.25, 150}};\n  TickBookSoA soa;\n  soa.add(101.5, 100); soa.add(101.75, 200); soa.add(101.25, 150);\n  std::cout << vwapAoS(aos) << "\\n";\n  std::cout << soa.vwap() << "\\n";\n  std::cout << sizeof(TickAoS) * aos.size() << "\\n";\n  std::cout << soa.count() << "\\n";\n}`,
 expected:"101.528\n101.528\n48\n3",
 solution:`struct TickAoS {\n    double price;\n    long volume;\n};\n\ndouble vwapAoS(const std::vector<TickAoS>& ticks) {\n    double weightedSum = 0.0;\n    long totalVolume = 0;\n    for (const auto& t : ticks) {\n        weightedSum += t.price * t.volume;\n        totalVolume += t.volume;\n    }\n    return weightedSum / totalVolume;\n}\n\nclass TickBookSoA {\npublic:\n    void add(double price, long volume) {\n        prices_.push_back(price);\n        volumes_.push_back(volume);\n    }\n\n    double vwap() const {\n        double weightedSum = 0.0;\n        long totalVolume = 0;\n        for (size_t i = 0; i < prices_.size(); ++i) {\n            weightedSum += prices_[i] * volumes_[i];\n            totalVolume += volumes_[i];\n        }\n        return weightedSum / totalVolume;\n    }\n\n    size_t count() const { return prices_.size(); }\n\nprivate:\n    std::vector<double> prices_;\n    std::vector<long> volumes_;\n};\n\n// A loop that only reads price touches every field of every TickAoS anyway\n// (fewer ticks per cache line), whereas the SoA prices_ vector packs only\n// prices contiguously -- more useful values per cache line as tick count grows.`},

{id:21, part:"quantperf", std:"C++11",
 title:"A fixed-size object pool with placement new",
 primer:"Placement new constructs an object at an already-allocated memory address instead of allocating fresh storage, letting a pool hand out and reuse fixed slots without touching the heap allocator on every request.",
 includes:["iostream","utility"],
 hints:["A pool pre-allocates one contiguous, correctly-aligned raw byte buffer (alignas(T) unsigned char storage[N * sizeof(T)]) up front, and hands out slots from it — no heap allocation happens per-object at all.","acquire() uses placement new (new (mem) T(args...)) to construct an object *in* an already-allocated slot, and release() explicitly calls the destructor (obj->~T()) before returning the slot to the free list — construction and memory allocation are fully decoupled.","Because the free list is LIFO (a simple stack of free slots), releasing an object and immediately acquiring a new one reuses the exact same memory address — which is a good way to confirm your pool is really reusing slots rather than silently falling back to the heap."],
 bullets:[
  "Write a fixed-capacity ObjectPool<T, N> template holding N slots of raw, correctly-aligned storage for T, plus a free list of available slot addresses.",
  "Implement acquire(Args&&... args) using placement new to construct a T in a free slot (forwarding constructor arguments), returning nullptr if the pool is exhausted.",
  "Implement release(T*) that explicitly calls the destructor and returns the slot to the free list.",
  "Confirm that after acquiring an object, releasing it, and acquiring a new one, the new object's address is identical to the released one's — the pool is reusing memory rather than allocating fresh."
 ],
 validates:["placement new","manual destructor calls","object pooling for allocation-free hot paths"],
 driver:`int main(){\n  ObjectPool<Order,4> pool;\n  std::cout << pool.available() << "\\n";\n  Order* a = pool.acquire(1, 100.5);\n  Order* b = pool.acquire(2, 200.25);\n  std::cout << pool.available() << " " << a->id << " " << b->price << "\\n";\n  pool.release(a);\n  std::cout << pool.available() << "\\n";\n  Order* c = pool.acquire(3, 50.0);\n  std::cout << (c == a) << " " << c->id << "\\n";\n  pool.release(b);\n  pool.release(c);\n  std::cout << pool.available() << "\\n";\n}`,
 expected:"4\n2 1 200.25\n3\n1 3\n4",
 solution:`struct Order {\n    int id;\n    double price;\n    Order(int id, double price) : id(id), price(price) {}\n};\n\ntemplate <typename T, size_t N>\nclass ObjectPool {\npublic:\n    ObjectPool() {\n        for (size_t i = 0; i < N; ++i) freeList_.push_back(i);\n    }\n\n    template <typename... Args>\n    T* acquire(Args&&... args) {\n        if (freeList_.empty()) return nullptr;\n        size_t slot = freeList_.back();\n        freeList_.pop_back();\n        T* ptr = reinterpret_cast<T*>(&storage_[slot]);\n        new (ptr) T(std::forward<Args>(args)...); // placement new: construct in-place\n        return ptr;\n    }\n\n    void release(T* obj) {\n        obj->~T();      // manual destructor call\n        size_t slot = reinterpret_cast<Slot*>(obj) - storage_;\n        freeList_.push_back(slot);\n    }\n\n    size_t available() const { return freeList_.size(); }\n\nprivate:\n    using Slot = std::aligned_storage_t<sizeof(T), alignof(T)>;\n    Slot storage_[N];\n    std::vector<size_t> freeList_; // LIFO free list\n};`},

{id:22, part:"quantperf", std:"pre-11",
 title:"Small Buffer / Small Object Optimization",
 primer:"A small-object-optimized type keeps a fixed-size inline buffer as a member and only falls back to a heap allocation once the payload exceeds that inline capacity — the same trick behind most std::string implementations' short-string handling.",
 includes:["iostream","cstring"],
 hints:["A small-buffer-optimized type keeps a fixed-size inline char array as a member and only reaches for the heap (a separate new[] allocation) once the payload exceeds that inline capacity — short values never touch the allocator at all.","data() needs to return whichever buffer is actually in use — the heap pointer if it's non-null, otherwise the inline array — and isSmall() is just a check of whether the heap pointer is null.","This is exactly the trick behind std::string's small-string optimization in every major standard library implementation: short strings (typically up to 15-22 bytes depending on the library) live entirely inside the string object with zero heap allocations."],
 bullets:[
  "Write a SmallString class with a fixed inline char buffer (say 16 bytes) and a nullable heap char* pointer, both alongside a stored length.",
  "In the constructor, copy the input into the inline buffer if it fits; otherwise allocate a heap buffer sized to the input and copy there instead.",
  "Add data(), isSmall(), and size() accessors that correctly reflect which storage is actually in use, and a destructor that frees the heap buffer only if one was allocated.",
  "Construct one short and one long string, confirm isSmall() correctly distinguishes them, and print sizeof(SmallString) to see the fixed per-object overhead this design pays even for tiny strings."
 ],
 validates:["small buffer optimization","inline storage vs. heap fallback","std::string SSO analog"],
 driver:`int main(){\n  SmallString ticker("AAPL");\n  SmallString longName("this-is-a-very-long-symbol-name-exceeding-inline-cap");\n  std::cout << std::boolalpha << ticker.isSmall() << " " << longName.isSmall() << "\\n";\n  std::cout << ticker.data() << "\\n";\n  std::cout << longName.data() << "\\n";\n  std::cout << ticker.size() << " " << longName.size() << "\\n";\n  std::cout << sizeof(SmallString) << "\\n";\n}`,
 expected:"true false\nAAPL\nthis-is-a-very-long-symbol-name-exceeding-inline-cap\n4 52\n32",
 solution:`class SmallString {\npublic:\n    explicit SmallString(const char* str) {\n        size_ = std::strlen(str);\n        if (size_ < sizeof(inline_)) {\n            std::memcpy(inline_, str, size_ + 1);\n            heap_ = nullptr;\n        } else {\n            heap_ = new char[size_ + 1];\n            std::memcpy(heap_, str, size_ + 1);\n        }\n    }\n\n    ~SmallString() { delete[] heap_; }\n\n    bool isSmall() const { return heap_ == nullptr; }\n    const char* data() const { return heap_ ? heap_ : inline_; }\n    size_t size() const { return size_; }\n\nprivate:\n    char inline_[16];\n    char* heap_ = nullptr;\n    size_t size_ = 0;\n};\n// sizeof(SmallString) == 32: 16 (inline buffer) + 8 (heap_ pointer)\n// + 8 (size_ as size_t) -- fixed per-object overhead paid even for "AAPL".`},
];

const CONCEPTS = [
{id:1, std:"core",
 question:"For a class with several ordinary (non-virtual) member functions but no virtual functions, and a single int data member, what is sizeof(that class)?",
 answer:"The same as sizeof(int) — typically 4 bytes. Member functions aren't stored per-object at all; there's exactly one copy of each function's machine code shared by every instance, and the compiler passes a hidden 'this' argument to reach the right object's data. Adding more non-virtual member functions never changes an object's size."},

{id:2, std:"core",
 question:"Now add a single virtual function to that same class. What happens to sizeof(class), and why?",
 answer:"It grows by the size of one pointer — typically 8 bytes on a 64-bit target. The compiler adds a hidden vtable pointer ('vptr') to every instance, pointing at a single per-class table of function pointers used to resolve virtual calls at runtime. Adding a second, third, or tenth virtual function doesn't grow the object any further — there's still just one vptr, and the table it points to simply grows to hold more entries."},

{id:3, std:"core",
 question:"If a class inherits from two base classes that each independently declare virtual functions, how many vptrs does an instance of the derived class typically carry?",
 answer:"Two — one per base subobject that introduces its own virtual function table (unless one base's vtable is reused because it's the primary base). This is part of why multiple inheritance with polymorphic bases can add more per-object overhead than single inheritance, and why pointer adjustments are sometimes needed when casting between base and derived pointers."},

{id:4, std:"core",
 question:"What actually happens if you call a virtual function from inside a base class's own constructor?",
 answer:"It resolves to the base class's own version of that function — never to an override defined in a more-derived class — even if the object being constructed is ultimately of a derived type. During the base constructor's execution, the derived part of the object hasn't been constructed yet and the object's vptr still points at the base class's vtable, so virtual dispatch behaves as if the object were only ever the base type. The same applies symmetrically to destructors."},

{id:5, std:"core",
 question:"Do default arguments on a virtual function participate in dynamic (runtime) dispatch, or static (compile-time) binding?",
 answer:"Default arguments are resolved statically, based on the static type of the expression used to make the call — not the function actually invoked at runtime. Calling a virtual function through a base-class pointer uses the base class's default argument values even if the call dispatches to a derived class's override with different declared defaults — a classic gotcha if an override changes its defaults."},

{id:6, std:"core",
 question:"Is sizeof(SomeEmptyClass) ever 0 in C++?",
 answer:"No. Every complete object type has a size of at least 1 byte, even a class with no data members and no virtual functions, specifically so that two distinct objects are guaranteed to have distinct addresses. This is also exactly why the Empty Base Optimization matters — as a base class, that same empty type can still add zero bytes to a derived object, since it doesn't need its own distinct address there."},

{id:7, std:"core",
 question:"Why does a purely abstract base class — one whose only member is a pure virtual destructor — still need that destructor defined somewhere?",
 answer:"A derived class's destructor always calls its base class's destructor as part of normal teardown, regardless of whether the base destructor is pure virtual — 'pure virtual' only means the base can't be instantiated directly; it doesn't exempt the destructor from needing an actual implementation to run during that teardown chain. Declaring it pure virtual without also defining it causes a linker error the first time a derived class is destroyed."},

{id:8, std:"core",
 question:"What's the actual machine-level cost of a virtual function call versus an ordinary (non-virtual) call?",
 answer:"A non-virtual call is typically a direct call to a fixed address, which the compiler can often inline. A virtual call instead requires an extra memory load through the object's vptr to find the class's vtable, then an indirect call through a function pointer at a computed offset in that table — meaningfully more work, and something the compiler generally cannot inline across since the target isn't known until runtime. In tight, hot loops this indirection is exactly why performance-sensitive code sometimes reaches for CRTP-style static polymorphism instead."},

{id:9, std:"core",
 question:"Does the compiler always generate a default constructor, copy constructor, copy-assignment operator, and destructor for a class, no matter what you declare yourself?",
 answer:"No — declaring almost any special member function suppresses at least some of the others. Declaring any constructor (even a non-default one) suppresses the implicitly-generated default constructor. Declaring a destructor, a copy constructor, or a copy-assignment operator suppresses the implicitly-generated move constructor and move assignment operator entirely, falling back to copy semantics if copy operations are still available — precisely the gotcha the Rule of Three vs. Rule of Five drills are built around."},

{id:10, std:"core",
 question:"Between composition (holding another object as a data member) and inheriting from it, which one, if either, can take advantage of the Empty Base Optimization?",
 answer:"Only inheritance. An empty class held as a data member always needs its own distinct address, so it still consumes at least 1 byte of the containing object's storage — typically rounded up further by alignment. An empty class used as a base class, by contrast, is allowed to share the derived object's starting address and can add zero bytes overall, which is why the mixins exercise frames this as a base-vs-member distinction rather than an inheritance-vs-composition one."},
];

const state = {};
EXERCISES.forEach(e => state[e.id] = { done:false });
CONCEPTS.forEach(c => state["c" + c.id] = { done:false });

const mainEl = document.getElementById("main");

function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function render(){
  mainEl.innerHTML = "";
  let lastPart = null;
  EXERCISES.forEach(ex => {
    if(ex.part !== lastPart){
      lastPart = ex.part;
      const div = document.createElement("div");
      div.className = "part-divider";
      div.textContent = PARTS[ex.part].label;
      mainEl.appendChild(div);
    }
    mainEl.appendChild(buildCard(ex));
  });

  const conceptDivider = document.createElement("div");
  conceptDivider.className = "part-divider";
  conceptDivider.textContent = "Knowledge Check — No Coding Required";
  mainEl.appendChild(conceptDivider);
  const intro = document.createElement("p");
