  intro.className = "section-intro";
  intro.textContent = "Quick conceptual questions of the kind that come up in a quant-dev interview alongside the coding drills. Think it through, then reveal the answer to check yourself.";
  mainEl.appendChild(intro);
  CONCEPTS.forEach(c => mainEl.appendChild(buildConceptCard(c)));

  updateStats();
}

function buildCard(ex){
  const st = state[ex.id];
  const details = document.createElement("details");
  details.className = "card" + (st.done ? " done" : "");
  details.dataset.id = ex.id;

  const summary = document.createElement("summary");
  summary.className = "card-head";
  summary.innerHTML = `
    <span class="chk">${st.done ? "✓" : ""}</span>
    <span class="num">${String(ex.id).padStart(2,"0")}</span>
    <span class="card-title"><span class="t">${esc(ex.title)}</span></span>
    <span class="chips">
      <span class="chip std">${esc(ex.std)}</span>
    </span>
    <span class="arrow">▸</span>
  `;
  summary.querySelector(".chk").addEventListener("click", (e) => {
    e.preventDefault(); e.stopPropagation();
    setDone(ex, !st.done);
  });

  const noteHtml = ex.note ? `<div class="note">${esc(ex.note)}</div>` : "";

  const hintsHtml = (ex.hints && ex.hints.length) ? `
    <button class="hints-toggle" type="button">show hint (1/${ex.hints.length})</button>
    <ul class="hint-list">${ex.hints.map(h => `<li>${esc(h)}</li>`).join("")}</ul>
  ` : "";

  const solutionHtml = ex.solution ? `
    <h4>solution</h4>
    <button class="reveal-toggle solution-toggle" type="button">reveal solution</button>
    <pre class="solution-box"><code>${esc(ex.solution)}</code></pre>
  ` : "";

  const body = document.createElement("div");
  body.className = "card-body";
  body.innerHTML = `
    <div class="primer">${esc(ex.primer)}</div>
    <ul>${ex.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>
    ${hintsHtml}
    <div class="validates">${ex.validates.map(v => `<span class="vtag">validates: ${esc(v)}</span>`).join("")}</div>
    <div class="driver-head">
      <h4>test driver — append to your file</h4>
      <button class="copy-btn" type="button" data-id="${ex.id}">copy</button>
    </div>
    <pre><code>${esc(fullDriver(ex))}</code></pre>
    <h4>expected stdout</h4>
    <pre class="expected"><code>${esc(ex.expected)}</code></pre>
    ${solutionHtml}
    ${noteHtml}
  `;

  const solutionBtn = body.querySelector(".solution-toggle");
  if (solutionBtn) {
    solutionBtn.addEventListener("click", () => {
      const box = solutionBtn.nextElementSibling;
      const showing = box.classList.toggle("shown");
      solutionBtn.textContent = showing ? "hide solution" : "reveal solution";
    });
  }

  details.appendChild(summary);
  details.appendChild(body);
  return details;
}

function buildConceptCard(c){
  const key = "c" + c.id;
  const st = state[key];
  const details = document.createElement("details");
  details.className = "card concept-card" + (st.done ? " done" : "");
  details.dataset.ckey = key;

  const summary = document.createElement("summary");
  summary.className = "card-head";
  summary.innerHTML = `
    <span class="chk">${st.done ? "✓" : ""}</span>
    <span class="num">Q${String(c.id).padStart(2,"0")}</span>
    <span class="card-title"><span class="t">${esc(c.question)}</span></span>
    <span class="chips">
      <span class="chip std">${esc(c.std)}</span>
    </span>
    <span class="arrow">▸</span>
  `;
  summary.querySelector(".chk").addEventListener("click", (e) => {
    e.preventDefault(); e.stopPropagation();
    setConceptDone(key, !st.done);
  });

  const body = document.createElement("div");
  body.className = "card-body";
  body.innerHTML = `
    <button class="reveal-toggle" type="button">reveal answer</button>
    <div class="answer-box">${esc(c.answer)}</div>
  `;
  body.querySelector(".reveal-toggle").addEventListener("click", (e) => {
    const btn = e.currentTarget;
    const box = btn.nextElementSibling;
    const showing = box.classList.toggle("shown");
    btn.textContent = showing ? "hide answer" : "reveal answer";
  });

  details.appendChild(summary);
  details.appendChild(body);
  return details;
}

function setConceptDone(key, val){
  const st = state[key];
  st.done = val;
  const card = mainEl.querySelector(`.card[data-ckey="${key}"]`);
  if(card){
    card.classList.toggle("done", st.done);
    card.querySelector(".chk").innerHTML = st.done ? "✓" : "";
  }
  updateStats();
}

function fullDriver(ex){
  const includesBlock = (ex.includes || []).map(i => `#include <${i}>`).join("\n");
  return includesBlock ? `${includesBlock}\n\n${ex.driver}` : ex.driver;
}

function setDone(ex, val){
  const st = state[ex.id];
  st.done = val;
  const card = mainEl.querySelector(`.card[data-id="${ex.id}"]`);
  if(card){
    card.classList.toggle("done", st.done);
    card.querySelector(".chk").innerHTML = st.done ? "✓" : "";
  }
  updateStats();
}

function updateStats(){
  const exDone = EXERCISES.filter(e => state[e.id].done).length;
  const conceptDone = CONCEPTS.filter(c => state["c" + c.id].done).length;
  document.querySelector("#stat-progress").textContent = exDone + conceptDone;
  document.querySelector("#stat-total").textContent = EXERCISES.length + CONCEPTS.length;
}

document.addEventListener("click", (e) => {
  const toggle = e.target.closest(".hints-toggle");
  if(!toggle) return;
  const list = toggle.nextElementSibling;
  const items = list.querySelectorAll("li");
  const revealedCount = list.querySelectorAll("li.revealed").length;
  if(revealedCount < items.length){
    items[revealedCount].classList.add("revealed");
    const nowRevealed = revealedCount + 1;
    toggle.textContent = nowRevealed < items.length
      ? `show hint (${nowRevealed + 1}/${items.length})`
      : "hide hints";
  } else {
    items.forEach(li => li.classList.remove("revealed"));
    toggle.textContent = `show hint (1/${items.length})`;
  }
});

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try{
      document.execCommand("copy") ? resolve() : reject(new Error("execCommand failed"));
    }catch(err){
      reject(err);
    }finally{
      document.body.removeChild(ta);
    }
  });
}

document.addEventListener("click", (e) => {
  const btn = e.target.closest(".copy-btn");
  if(!btn) return;
  const ex = EXERCISES.find(x => String(x.id) === btn.dataset.id);
  if(!ex) return;
  copyText(fullDriver(ex)).then(() => {
    btn.textContent = "copied!";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "copy"; btn.classList.remove("copied"); }, 1500);
  }).catch(() => {
    btn.textContent = "failed";
    setTimeout(() => { btn.textContent = "copy"; }, 1500);
  });
});

render();
</script>
</body>
</html>
